
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Funny Office Tasks - Spin Wheel</title>


    <!-- Bootstrap 5 -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        :root {

            --primary: #5b4bdb;

            --primary-dark: #4335ad;

            --page-bg: #f4f6fb;

            --text-dark: #24243a;

        }


        * {

            box-sizing: border-box;

        }


        body {

            margin: 0;

            background: var(--page-bg);

            color: var(--text-dark);

            font-family: Arial, sans-serif;

        }


        .page-wrapper {

            min-height: 100vh;

            padding: 35px 15px;

        }


        .main-card {

            max-width: 850px;

            margin: auto;

            background: #ffffff;

            border-radius: 24px;

            padding: 35px;

            box-shadow: 0 12px 45px rgba(30, 35, 75, 0.08);

        }


        .page-title {

            font-weight: 800;

            color: var(--primary);

        }


        .subtitle {

            color: #777891;

        }


        .wheel-area {

            position: relative;

            width: 100%;

            max-width: 560px;

            margin: 25px auto;

        }


        #wheelCanvas {

            display: block;
            background: #ffffff;
            border: 2px solid #dedcf8;

            width: 100%;

            height: auto;

            border-radius: 50%;

            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.12));

        }


        .wheel-pointer {

            position: absolute;

            top: -12px;

            left: 50%;

            transform: translateX(-50%);

            width: 0;

            height: 0;

            border-left: 18px solid transparent;

            border-right: 18px solid transparent;

            border-top: 35px solid #ef4444;

            z-index: 5;

            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2));

        }


        .spin-button {

            background: var(--primary);

            border: none;

            color: white;

            padding: 15px 35px;

            font-size: 18px;

            font-weight: 700;

            border-radius: 50px;

            transition: 0.2s ease;

        }


        .spin-button:hover {

            background: var(--primary-dark);

            color: white;

            transform: translateY(-2px);

        }


        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spin-button.unavailable {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }


        .selected-task {

            background: #f4f2ff;

            border-radius: 15px;

            padding: 25px;

            font-size: 20px;

            font-weight: 600;

            line-height: 1.6;

            color: #30246f;

        }


        .task-badge {

            display: inline-block;

            background: #e9e5ff;

            color: var(--primary);

            padding: 6px 14px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 700;

        }


        .modal-content {

            border: none;

            border-radius: 22px;

            overflow: hidden;

        }


        .modal-header {

            background: var(--primary);

            color: white;

            border: none;

        }


        .modal-header .btn-close {

            filter: brightness(0) invert(1);

        }


        @media (max-width: 575px) {

            .main-card {

                padding: 20px 15px;

                border-radius: 15px;

            }


            .page-title {

                font-size: 24px;

            }


            .selected-task {

                font-size: 17px;

                padding: 18px;

            }

        }

    </style>

</head>


<body>


    <div class="page-wrapper">

        <div class="main-card">


            <div class="text-center mb-4">

                <h1 class="page-title">

                    Funny Office Tasks

                </h1>


                <p class="subtitle mb-0">

                    Spin the wheel and find your funny challenge!

                </p>

            </div>


            <!-- Wheel Only -->

            <div class="text-center">


                <div class="wheel-area">

                    <div class="wheel-pointer"></div>


                    <canvas

                        id="wheelCanvas"

                        width="600"

                        height="600">

                    </canvas>

                </div>


                <button

                    type="button"

                    class="spin-button mt-3"

                    id="spinButton">

                    SPIN THE WHEEL

                </button>


                <p class="text-muted small mt-3 mb-0">

                    Spin the wheel to get your task!

                </p>


            </div>


        </div>

    </div>


    <!-- Selected Task Popup -->

    <div

        class="modal fade"

        id="taskModal"

        tabindex="-1"

        aria-labelledby="taskModalLabel"

        aria-hidden="true">


        <div class="modal-dialog modal-dialog-centered">


            <div class="modal-content">


                <div class="modal-header">


                    <h5

                        class="modal-title"

                        id="taskModalLabel">

                        Your Funny Office Task

                    </h5>


                    <button

                        type="button"

                        class="btn-close"

                        data-bs-dismiss="modal"

                        aria-label="Close">

                    </button>


                </div>


                <div class="modal-body text-center p-4">


                    <span

                        class="task-badge"

                        id="taskNumber">

                        Task 1

                    </span>


                    <div

                        class="selected-task mt-3"

                        id="selectedTask">

                        Your task will appear here.

                    </div>


                    <p class="text-muted mt-3 mb-0">

                        Good luck! Complete your challenge.

                    </p>


                </div>


                <div

                    class="modal-footer justify-content-center border-0 pb-4">


                    <button

                        type="button"

                        class="btn btn-outline-secondary rounded-pill px-4"

                        data-bs-dismiss="modal">

                        Close

                    </button>


                </div>


            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script

        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

    </script>


    <script>


        // =========================================

        // ALL 32 FUNNY OFFICE TASKS

        // =========================================


        const tasks = [


            'Say "I will not be late again" 20 times loudly.',


            'Make tea or coffee for your teammates without anyone’s help.',


            'Sing a short song for the team.',


            'Give compliments to 5 teammates. Share one positive note and one constructive note about each person.',


            'Buy chocolates and distribute them to all teammates.',


            'Observe and share each teammate’s daily habits throughout the day, excluding work-related activities.',


            'Perform a 1-minute dance to your favorite movie song.',


            'Choose any 5 office objects. Explain their names, purposes, and roles in the office in a funny way.',


            'Give a genuine compliment to every teammate.',


            'Speak only in English for the whole day, excluding work-related activities where another language is necessary.',


            'Act like a robot for 5 minutes.',


            'Make 5 different animal sounds and let your teammates guess the animals.',


            'Explain a pen as if you are launching a new product. Describe its features, purpose, and benefits.',


            'Act out 3 famous movie dialogues using different emotions.',


            'Share 5 interesting facts about yourself.',


            'Create a funny advertisement for your office chair.',


            'Perform a funny dance for 1 minute.',


            'Imitate a movie character for 2 minutes.',


            'Give a 1-minute motivational speech about punctuality and include a real-life example.',


            'Tell a funny childhood story to the team.',


            'Create a funny advertisement for a water bottle.',


            'Tell a fictional story using 5 office objects.',


            'Introduce yourself as if you are a famous celebrity.',


            'Create and present a funny advertisement for the company in 1 minute.',


            'Act like a supermarket salesperson and sell 5 office stationery items.',


            'Act like a fitness trainer and teach 5 easy exercises.',


            'Give a 1-minute funny proposal to your office chair explaining why it is important during office hours.',


            'Act out a song for 1 minute without making any sound or speaking. Let your teammates guess the song.',


            'Act out 3 movie titles using actions and sounds. Do not speak any words. Let your teammates guess the movies.',


            'Give a funny presentation about your dream superpower and explain what you would do with it.',


            'Act like a hotel receptionist welcoming your teammates to the office. Answer their questions in a funny way.',


            'Perform a 1-minute dance in a robot style.'


        ];


        // =========================================

        // DOM ELEMENTS

        // =========================================


        const canvas = document.getElementById('wheelCanvas');

        const ctx = canvas.getContext('2d');


        const spinButton = document.getElementById('spinButton');


        const selectedTask = document.getElementById('selectedTask');

        const taskNumber = document.getElementById('taskNumber');


        const taskModal = new bootstrap.Modal(

            document.getElementById('taskModal')

        );
// =========================================

        // WHEEL VARIABLES

        // =========================================


        const totalTasks = tasks.length;

        const sliceAngle = (Math.PI * 2) / totalTasks;


        let currentRotation = 0;

        let isSpinning = false;


        const colors = [

            '#5B4BDB',

            '#EF476F',

            '#06B6D4',

            '#F59E0B',

            '#10B981',

            '#8B5CF6',

            '#F97316',

            '#EC4899'

        ];
        // =========================================
        // DRAW WHEEL

        // =========================================


        function drawWheel() {


            const center = canvas.width / 2;

            const radius = center - 8;


            ctx.clearRect(

                0,

                0,

                canvas.width,

                canvas.height

            );


            ctx.save();


            ctx.translate(center, center);


            ctx.rotate(currentRotation);


            for (let i = 0; i < totalTasks; i++) {


                const startAngle = i * sliceAngle;

                const endAngle = startAngle + sliceAngle;


                // Wheel slice

                ctx.beginPath();


                ctx.moveTo(0, 0);


                ctx.arc(

                    0,

                    0,

                    radius,

                    startAngle,

                    endAngle

                );


                ctx.closePath();


                ctx.fillStyle = colors[i % colors.length];


                ctx.fill();


                ctx.strokeStyle = '#ffffff';


                ctx.lineWidth = 2;


                ctx.stroke();


                // Task number

                const middleAngle = startAngle + sliceAngle / 2;


                ctx.save();


                ctx.rotate(middleAngle);


                ctx.fillStyle = '#ffffff';


                ctx.font = 'bold 15px Arial';


                ctx.textAlign = 'center';


                ctx.textBaseline = 'middle';


                ctx.fillText(

                    String(i + 1),

                    radius * 0.82,

                    0

                );


                ctx.restore();


            }


            ctx.restore();


            // Center circle

            ctx.beginPath();


            ctx.arc(

                center,

                center,

                43,

                0,

                Math.PI * 2

            );


            ctx.fillStyle = '#ffffff';


            ctx.fill();


            ctx.strokeStyle = '#dedcf8';


            ctx.lineWidth = 5;


            ctx.stroke();


            ctx.fillStyle = '#5B4BDB';


            ctx.font = 'bold 14px Arial';


            ctx.textAlign = 'center';


            ctx.textBaseline = 'middle';


            ctx.fillText(

                'SPIN',

                center,

                center

            );


        }


        // =========================================

        // SHOW SELECTED TASK

        // =========================================


        function showTask(index) {


            taskNumber.textContent = `Task ${index + 1}`;


            selectedTask.textContent = tasks[index];


            taskModal.show();


        }


        // =========================================

        // SPIN WHEEL

        // =========================================


        // =========================================
        // SPIN TIME CONTROL
        // Spin is available only from 9:45 AM to 10:10 AM.
        // =========================================

        function isSpinTimeAvailable() {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            const startMinutes = 9 * 60 + 45;   // 09:45 AM
            const endMinutes = 10 * 60 + 10;    // 10:10 AM

            return currentMinutes >= startMinutes &&
                   currentMinutes <= endMinutes;
        }

        function updateSpinButton() {
            if (isSpinTimeAvailable()) {
                spinButton.textContent = 'SPIN THE WHEEL';
                spinButton.disabled = false;
                spinButton.classList.remove('unavailable');
            } else {
                spinButton.textContent = 'NOT AVAILABLE';
                spinButton.disabled = true;
                spinButton.classList.add('unavailable');
            }
        }


        function spinWheel() {

            // Final protection: check the current time again.
            if (!isSpinTimeAvailable()) {
                updateSpinButton();
                return;
            }

            if (isSpinning) return;


            isSpinning = true;


            spinButton.disabled = true;


            const selectedIndex = Math.floor(

                Math.random() * totalTasks

            );


            // Pointer is at the top (-90 degrees)

            const targetAngle =

                -(selectedIndex * sliceAngle + sliceAngle / 2) -

                Math.PI / 2;


            const fullSpins = 6 + Math.floor(Math.random() * 3);


            const currentMod = currentRotation % (Math.PI * 2);


            let delta = targetAngle - currentMod;


            if (delta < 0) {

                delta += Math.PI * 2;

            }


            const startRotation = currentRotation;


            const endRotation =

                currentRotation +

                fullSpins * Math.PI * 2 +

                delta;


            const duration = 4500;


            const startTime = performance.now();


            function animate(now) {


                const elapsed = now - startTime;


                const progress = Math.min(

                    elapsed / duration,

                    1

                );


                // Ease-out animation

                const eased = 1 - Math.pow(1 - progress, 4);


                currentRotation =

                    startRotation +

                    (endRotation - startRotation) * eased;


                drawWheel();


                if (progress < 1) {


                    requestAnimationFrame(animate);


                } else {


                    currentRotation = endRotation;


                    drawWheel();


                    isSpinning = false;


                    spinButton.disabled = false;


                    showTask(selectedIndex);


                }

            }


            requestAnimationFrame(animate);

        }
        // =========================================
        // INITIAL SPIN BUTTON
        // =========================================

        spinButton.addEventListener('click', function () {
            if (!isSpinTimeAvailable()) {
                updateSpinButton();
                return;
            }

            spinWheel();
        });

        // Update immediately and then every second.
        updateSpinButton();
        setInterval(updateSpinButton, 1000);

        // =========================================
        // INITIAL WHEEL DRAW
        // =========================================


        

        // =========================================


        drawWheel();


    </script>


</body>

</html>
